<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="OptionSizer"/>
<meta name="theme-color" content="#0a0f1e"/>
<link rel="manifest" href="manifest.json"/>
<title>OptionSizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;700&display=swap');

  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1a2235;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.14);
    --green: #00e5a0;
    --green-dim: rgba(0,229,160,0.12);
    --green-mid: rgba(0,229,160,0.25);
    --red: #ff5f6d;
    --red-dim: rgba(255,95,109,0.12);
    --amber: #f5a623;
    --amber-dim: rgba(245,166,35,0.12);
    --text: #f0f4ff;
    --text2: #7a8ba8;
    --text3: #3d4f6a;
    --radius: 16px;
    --radius-sm: 10px;
    --mono: 'DM Mono', monospace;
    --display: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    overscroll-behavior: none;
  }

  body {
    min-height: 100vh;
    min-height: -webkit-fill-available;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .app {
    max-width: 430px;
    margin: 0 auto;
    padding: 16px 16px 32px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0 4px;
  }
  .header-title {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .header-title span { color: var(--green); }
  .offline-badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 20px;
    background: var(--green-dim);
    color: var(--green);
    border: 0.5px solid var(--green);
    letter-spacing: 0.05em;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 16px;
  }

  .card-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text2);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* Instrument selector */
  .inst-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .inst-btn {
    padding: 12px 8px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text2);
    font-family: var(--display);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    -webkit-user-select: none;
  }
  .inst-btn .lot {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    margin-top: 2px;
    font-weight: 400;
  }
  .inst-btn.active {
    background: var(--green-dim);
    border-color: var(--green);
    color: var(--green);
  }
  .inst-btn.active .lot { color: rgba(0,229,160,0.6); }
  .inst-btn:active { transform: scale(0.97); }

  .custom-lot-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .custom-lot-row label { font-size: 12px; color: var(--text2); white-space: nowrap; }
  .custom-lot-row input {
    flex: 1;
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    padding: 10px 12px;
    outline: none;
  }

  /* Input row */
  .input-block { margin-bottom: 0; }
  .big-input-wrap {
    display: flex;
    align-items: center;
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .big-input-wrap .prefix {
    padding: 0 10px 0 14px;
    font-size: 16px;
    color: var(--text2);
  }
  .big-input-wrap input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 500;
    padding: 14px 0;
    min-width: 0;
  }
  .big-input-wrap .unit {
    padding: 0 14px;
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.05em;
  }

  /* Quick adjust buttons */
  .quick-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .q-btn {
    flex: 1;
    padding: 9px 4px;
    border-radius: var(--radius-sm);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text2);
    transition: all 0.12s;
    -webkit-user-select: none;
  }
  .q-btn.pos { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .q-btn.neg { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .q-btn:active { transform: scale(0.95); opacity: 0.8; }

  /* SL presets — same size as q-btn */
  .sl-btn {
    flex: 1;
    padding: 9px 4px;
    border-radius: var(--radius-sm);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text2);
    text-align: center;
    transition: all 0.12s;
    -webkit-user-select: none;
  }
  .sl-btn.active { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }
  .sl-btn:active { transform: scale(0.95); opacity: 0.8; }

  /* Profit estimator */
  .profit-card {
    background: var(--surface);
    border: 0.5px solid rgba(0,229,160,0.2);
    border-radius: var(--radius);
    padding: 16px;
  }
  .profit-card .card-label { margin-bottom: 12px; }
  .profit-results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }
  .profit-metric {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 12px 10px;
    text-align: center;
    border: 0.5px solid var(--border);
  }
  .profit-metric .p-label {
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--text2);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .profit-metric .p-val {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 700;
    color: var(--green);
    line-height: 1;
  }
  .profit-metric .p-sub {
    font-size: 10px;
    color: var(--text3);
    margin-top: 4px;
  }
  .profit-metric.full { grid-column: span 2; }
  .rr-badge {
    display: inline-block;
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    background: var(--green-dim);
    color: var(--green);
    border: 0.5px solid rgba(0,229,160,0.3);
    margin-top: 10px;
  }

  /* Results */
  .results-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .result-card {
    border-radius: var(--radius-sm);
    padding: 14px 10px;
    text-align: center;
    border: 0.5px solid var(--border);
    background: var(--surface2);
  }
  .result-card .r-label {
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--text2);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .result-card .r-val {
    font-family: var(--display);
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
  }
  .result-card .r-sub {
    font-size: 10px;
    color: var(--text3);
    margin-top: 5px;
    line-height: 1.4;
  }
  .result-card.green { background: var(--green-dim); border-color: rgba(0,229,160,0.3); }
  .result-card.green .r-val { color: var(--green); }
  .result-card.red { background: var(--red-dim); border-color: rgba(255,95,109,0.3); }
  .result-card.red .r-val { color: var(--red); }

  /* Breakdown */
  .breakdown {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.9;
    border-top: 0.5px solid var(--border);
    margin-top: 14px;
    padding-top: 14px;
  }
  .breakdown b { color: var(--text); font-weight: 500; }

  /* Two-col layout for inputs */
  .two-col { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; width: 100%; overflow: hidden; }
  .two-col .card { min-width: 0; overflow: hidden; }
  .two-col .big-input-wrap { min-width: 0; }
  .two-col .big-input-wrap input { min-width: 0; width: 100%; }
  .two-col .quick-row { min-width: 0; }
  .two-col .q-btn, .two-col .sl-btn { min-width: 0; overflow: hidden; }

  /* Focus */
  input:focus { border-color: rgba(0,229,160,0.5) !important; }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-title">Option<span>Sizer</span></div>
    <div class="offline-badge">WORKS OFFLINE</div>
  </div>

  <!-- Instrument -->
  <div class="card">
    <div class="card-label">Instrument</div>
    <div class="inst-grid">
      <button class="inst-btn active" data-inst="NIFTY" onclick="selectInst(this)">
        NIFTY <span class="lot">lot 65</span>
      </button>
      <button class="inst-btn" data-inst="BANKNIFTY" onclick="selectInst(this)">
        BANKNIFTY <span class="lot">lot 30</span>
      </button>
      <button class="inst-btn" data-inst="FINNIFTY" onclick="selectInst(this)">
        FINNIFTY <span class="lot">lot 40</span>
      </button>
      <button class="inst-btn" data-inst="SENSEX" onclick="selectInst(this)">
        SENSEX <span class="lot">lot 20</span>
      </button>
      <button class="inst-btn" data-inst="CUSTOM" onclick="selectInst(this)" style="grid-column:span 2;">
        Custom <span class="lot">enter lot size</span>
      </button>
    </div>
    <div id="customWrap" class="custom-lot-row" style="display:none;">
      <label>Lot size</label>
      <input type="number" id="customLot" value="75" min="1" inputmode="numeric" oninput="compute()"/>
    </div>
  </div>

  <!-- Risk Amount -->
  <div class="card">
    <div class="card-label">Risk amount</div>
    <div class="big-input-wrap">
      <span class="prefix">₹</span>
      <input type="number" id="riskAmt" value="5000" min="100" inputmode="numeric" oninput="compute()"/>
    </div>
    <div class="quick-row">
      <button class="q-btn pos" onclick="adj('riskAmt', 1000)">+1000</button>
      <button class="q-btn pos" onclick="adj('riskAmt', 500)">+500</button>
      <button class="q-btn neg" onclick="adj('riskAmt', -500)">−500</button>
      <button class="q-btn neg" onclick="adj('riskAmt', -1000)">−1000</button>
    </div>
  </div>

  <!-- Premium + SL -->
  <div class="two-col">
    <div class="card">
      <div class="card-label">Premium</div>
      <div class="big-input-wrap">
        <span class="prefix">₹</span>
        <input type="number" id="premium" value="70" min="1" inputmode="numeric" oninput="compute()" style="font-size:18px;"/>
      </div>
      <div class="quick-row">
        <button class="q-btn" onclick="adj('premium',10)">+10</button>
        <button class="q-btn" onclick="adj('premium',-10)">−10</button>
      </div>
      <div class="quick-row">
        <button class="q-btn" onclick="adj('premium',5)">+5</button>
        <button class="q-btn" onclick="adj('premium',-5)">−5</button>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Stop loss</div>
      <div class="big-input-wrap">
        <input type="number" id="slPct" value="50" min="1" max="99" inputmode="numeric" oninput="setSLActive(); compute();" style="font-size:18px; padding-left:14px;"/>
        <span class="unit">%</span>
      </div>
      <div class="quick-row">
        <button class="sl-btn active" id="sl50" onclick="setSL(50)">50%</button>
        <button class="sl-btn" id="sl30" onclick="setSL(30)">30%</button>
      </div>
      <div class="quick-row">
        <button class="sl-btn" id="sl20" onclick="setSL(20)">20%</button>
        <button class="sl-btn" id="sl10" onclick="setSL(10)">10%</button>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div class="card">
    <div class="results-grid">
      <div class="result-card green">
        <div class="r-label">Lots</div>
        <div class="r-val" id="res-lots">—</div>
        <div class="r-sub" id="res-lots-sub">—</div>
      </div>
      <div class="result-card">
        <div class="r-label">Deployed</div>
        <div class="r-val" id="res-capital">—</div>
        <div class="r-sub" id="res-cap-sub">per lot</div>
      </div>
      <div class="result-card red">
        <div class="r-label">Max risk</div>
        <div class="r-val" id="res-risk">—</div>
        <div class="r-sub" id="res-risk-sub">per lot</div>
      </div>
    </div>
    <div class="breakdown" id="breakdown"></div>
  </div>

  <!-- Profit Estimator -->
  <div class="profit-card">
    <div class="card-label">📈 Profit Estimator</div>
    <div class="big-input-wrap">
      <input type="number" id="profitPct" value="20" min="1" max="500" inputmode="numeric" oninput="computeProfit()" style="font-size:20px; font-weight:500; padding-left:14px;"/>
      <span class="unit">% gain</span>
    </div>
    <div class="quick-row" style="margin-top:8px;">
      <button class="q-btn pos" onclick="adjProfit(10)">+10%</button>
      <button class="q-btn pos" onclick="adjProfit(5)">+5%</button>
      <button class="q-btn neg" onclick="adjProfit(-5)">−5%</button>
      <button class="q-btn neg" onclick="adjProfit(-10)">−10%</button>
    </div>
    <div class="profit-results">
      <div class="profit-metric">
        <div class="p-label">Profit (₹)</div>
        <div class="p-val" id="p-profit">—</div>
        <div class="p-sub" id="p-profit-sub">on deployed capital</div>
      </div>
      <div class="profit-metric">
        <div class="p-label">Exit value</div>
        <div class="p-val" id="p-exit">—</div>
        <div class="p-sub" id="p-exit-sub">total receivable</div>
      </div>
      <div class="profit-metric full" style="text-align:left; padding:12px 14px;">
        <div class="p-label" style="margin-bottom:6px;">Risk · Reward</div>
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <span id="rr-text" style="font-size:13px; color:var(--text2);">—</span>
          <span class="rr-badge" id="rr-badge" style="display:none;"></span>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  const LOT = { NIFTY:65, BANKNIFTY:30, FINNIFTY:40, SENSEX:20 };
  let currentInst = 'NIFTY';
  let deployedCapital = 0;
  let maxRiskAmt = 0;

  function selectInst(btn) {
    document.querySelectorAll('.inst-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentInst = btn.dataset.inst;
    document.getElementById('customWrap').style.display = currentInst === 'CUSTOM' ? 'flex' : 'none';
    compute();
  }

  function getLot() {
    return currentInst === 'CUSTOM'
      ? (parseInt(document.getElementById('customLot').value) || 1)
      : LOT[currentInst];
  }

  function num(id) { return parseFloat(document.getElementById(id).value) || 0; }

  function adj(id, delta) {
    const el = document.getElementById(id);
    const min = parseFloat(el.min) || 0;
    el.value = Math.max(min, (parseFloat(el.value) || 0) + delta);
    compute();
  }

  function adjProfit(delta) {
    const el = document.getElementById('profitPct');
    el.value = Math.max(1, (parseFloat(el.value) || 0) + delta);
    computeProfit();
  }

  function setSL(v) {
    document.getElementById('slPct').value = v;
    setSLActive();
    compute();
  }

  function setSLActive() {
    const v = num('slPct');
    ['sl50','sl30','sl20','sl10'].forEach(id => document.getElementById(id).classList.remove('active'));
    if (v === 50) document.getElementById('sl50').classList.add('active');
    else if (v === 30) document.getElementById('sl30').classList.add('active');
    else if (v === 20) document.getElementById('sl20').classList.add('active');
    else if (v === 10) document.getElementById('sl10').classList.add('active');
  }

  function fmt(n) {
    if (n >= 100000) return '₹' + (n/100000).toFixed(1) + 'L';
    if (n >= 1000) return '₹' + (n/1000).toFixed(1) + 'k';
    return '₹' + Math.round(n);
  }
  function fmtFull(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }

  function compute() {
    const riskAmt = num('riskAmt');
    const premium = num('premium');
    const slPct = num('slPct');
    const lotSize = getLot();
    const instLabel = currentInst === 'CUSTOM' ? 'Custom' : currentInst;

    const slPerShare = premium * slPct / 100;
    const riskPerLot = slPerShare * lotSize;
    let lots = riskPerLot > 0 ? Math.floor(riskAmt / riskPerLot) : 0;
    if (lots < 1 && riskPerLot > 0) lots = 1;

    const premPerLot = premium * lotSize;
    const totalCapital = lots * premPerLot;
    const totalRisk = lots * riskPerLot;

    deployedCapital = totalCapital;
    maxRiskAmt = totalRisk;

    document.getElementById('res-lots').textContent = lots || '—';
    document.getElementById('res-lots-sub').textContent = lots ? lotSize + ' × ' + lots : '';
    document.getElementById('res-capital').textContent = lots ? fmt(totalCapital) : '—';
    document.getElementById('res-cap-sub').textContent = lots ? fmtFull(premPerLot) + '/lot' : '';
    document.getElementById('res-risk').textContent = lots ? fmt(totalRisk) : '—';
    document.getElementById('res-risk-sub').textContent = lots ? fmtFull(riskPerLot) + '/lot' : '';

    document.getElementById('breakdown').innerHTML = lots
      ? `<b>${instLabel}</b> &nbsp;·&nbsp; Lot: <b>${lotSize} shares</b> &nbsp;·&nbsp; Budget: <b>${fmtFull(riskAmt)}</b><br>` +
        `Premium: <b>₹${premium}</b> &nbsp;·&nbsp; SL: <b>${slPct}%</b> = ₹${slPerShare.toFixed(1)}/sh &nbsp;·&nbsp; Risk/lot: <b>${fmtFull(riskPerLot)}</b>`
      : '<b>Enter values above to see position size</b>';

    computeProfit();
  }

  function computeProfit() {
    const pct = num('profitPct');
    if (!deployedCapital || !pct) {
      document.getElementById('p-profit').textContent = '—';
      document.getElementById('p-exit').textContent = '—';
      document.getElementById('rr-text').textContent = 'Enter position details above first';
      document.getElementById('rr-badge').style.display = 'none';
      return;
    }
    const profit = deployedCapital * pct / 100;
    const exitVal = deployedCapital + profit;
    const rr = maxRiskAmt > 0 ? (profit / maxRiskAmt).toFixed(2) : '—';

    document.getElementById('p-profit').textContent = fmt(profit);
    document.getElementById('p-profit-sub').textContent = fmtFull(profit) + ' gain';
    document.getElementById('p-exit').textContent = fmt(exitVal);
    document.getElementById('p-exit-sub').textContent = fmtFull(exitVal) + ' total';

    document.getElementById('rr-text').textContent =
      `Risk ${fmtFull(maxRiskAmt)}  →  Reward ${fmtFull(profit)}`;
    const badge = document.getElementById('rr-badge');
    badge.style.display = 'inline-block';
    badge.textContent = `R:R  1 : ${rr}`;
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }

  compute();
</script>
</body>
</html>
